<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऑनलाइन मल्टीप्लेयर चेस</title>
    <!-- Chessboard.js CSS -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 5px; }
        .setup-box {
            background: #34495e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        input {
            padding: 8px;
            font-size: 1rem;
            border-radius: 4px;
            border: none;
            margin: 5px;
            width: 150px;
            text-align: center;
        }
        button {
            padding: 8px 15px;
            font-size: 1rem;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #27ae60; }
        #gameArea { display: none; text-align: center; }
        #status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            background: #16a085;
            padding: 8px 15px;
            border-radius: 4px;
            display: inline-block;
        }
        #board {
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 5px;
            overflow: hidden;
        }
        .info-txt { margin-top: 10px; font-size: 0.9rem; color: #bdc3c7; }
    </style>
</head>
<body>

    <h1>♟️ ऑनलाइन चेस गेम ♟️</h1>

    <!-- रूम जॉइन करने का सेटअप -->
    <div id="setup" class="setup-box">
        <h3>रूम सेटअप करें</h3>
        <input type="text" id="roomInput" placeholder="रूम कोड (उदा: 1234)">
        <br><br>
        <button id="createBtn" style="background-color: #3498db;">नया रूम बनाएँ (White)</button>
        <button id="joinBtn">रूम में जुड़ें (Black)</button>
    </div>

    <!-- गेम खेलने का एरिया -->
    <div id="gameArea">
        <div id="status">विरोधी का इंतज़ार है...</div>
        <div id="board"></div>
        <p class="info-txt" id="playerColorTxt"></p>
    </div>

    <!-- आवश्यक लाइब्रेरीज़ -->
    <script src="https://jquery.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <!-- Firebase SDK (v8) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // ⚠️ मुफ़्त Firebase कॉन्फ़िगरेशन (यह डेमो डेटाबेस है)
        
            // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAjqIzlrb9aq8qtEtYFA9GbDZeiydVvbz4",
  authDomain: "git9-43302.firebaseapp.com",
  databaseURL: "https://git9-43302-default-rtdb.firebaseio.com",
  projectId: "git9-43302",
  storageBucket: "git9-43302.firebasestorage.app",
  messagingSenderId: "724237457030",
  appId: "1:724237457030:web:a65c2756f1aa13503aa307",
  measurementId: "G-W8Q9T9KRP1"
};" 
      
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let board = null;
        let game = new Chess();
        let roomCode = '';
        let myColor = ''; // 'w' या 'b'
        let gameRef = null;

        // नया रूम बनाने पर (White खिलाड़ी)
        $('#createBtn').on('click', function() {
            roomCode = $('#roomInput').val().trim();
            if(!roomCode) return alert('कृपया कोई रूम कोड डालें!');
            myColor = 'w';
            initGame();
        });

        // बने हुए रूम में जुड़ने पर (Black खिलाड़ी)
        $('#joinBtn').on('click', function() {
            roomCode = $('#roomInput').val().trim();
            if(!roomCode) return alert('कृपया रूम कोड डालें!');
            myColor = 'b';
            initGame();
        });

        function initGame() {
            $('#setup').hide();
            $('#gameArea').show();
            $('#playerColorTxt').text(`आपकी गोटियाँ: ${myColor === 'w' ? 'White (सफेद)' : 'Black (काला)'}`);

            gameRef = database.ref('chess_rooms/' + roomCode);

            // अगर नया रूम है, तो डेटाबेस रीसेट करें
            if (myColor === 'w') {
                gameRef.set({
                    fen: game.fen(),
                    turn: 'w'
                });
            }

            // बोर्ड को कॉन्फ़िगर करें
            const config = {
                draggable: true,
                position: game.fen(),
                orientation: myColor === 'w' ? 'white' : 'black',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
                pieceTheme: 'https://chessboardjs.com{piece}.png'
            };
            board = Chessboard('board', config);

            // इंटरनेट/डेटाबेस से चालों को लाइव सुनना
            gameRef.on('value', function(snapshot) {
                const data = snapshot.val();
                if (data) {
                    game.load(data.fen);
                    board.position(data.fen);
                    updateStatus();
                }
            });
        }

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;

            // नियम 1: खिलाड़ी सिर्फ अपनी बारी पर ही गोटी चल सकता है
            if (game.turn() !== myColor) return false;

            // नियम 2: सफेद खिलाड़ी काले की गोटी नहीं छू सकता और उल्टा भी
            if ((myColor === 'w' && piece.search(/^b/) !== -1) ||
                (myColor === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop (source, target) {
            let move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            // चाल चलने के बाद तुरंत डेटाबेस में अपडेट करें ताकि दोस्त को दिखे
            gameRef.set({
                fen: game.fen(),
                turn: game.turn()
            });

            updateStatus();
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            let status = '';
            let moveColor = game.turn() === 'b' ? 'Black (काला)' : 'White (सफेद)';

            if (game.in_checkmate()) {
                status = `गेम खत्म! ${moveColor} हार गया (Checkmate)।`;
            } else if (game.in_draw()) {
                status = 'गेम खत्म! मैच ड्रॉ हो गया।';
            } else {
                status = `चाल: ${moveColor} की`;
                if (game.turn() === myColor) {
                    status += " 🟢 (आपकी बारी)";
                } else {
                    status += " ⏳ (दोस्त की बारी)";
                }
                if (game.in_check()) {
                    status += ' - (Check!)';
                }
            }
            $('#status').html(status);
        }
    </script>
</body>
</html>
