<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .verify-container {
            background: #1e293b;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            text-align: center;
            width: 100%;
            max-width: 380px;
        }
        h3 {
            margin-bottom: 8px;
            color: #f8fafc;
            font-size: 20px;
            font-weight: 700;
        }
        .info-text {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .checkbox-wrapper {
            position: relative;
            background-color: #334155;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid #475569;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }
        .checkbox-wrapper.disabled {
            cursor: not-allowed;
            opacity: 0.85;
            background-color: #1e293b;
        }
        .checkbox-wrapper input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #2563eb;
        }
        .checkbox-wrapper.disabled input[type="checkbox"] {
            cursor: not-allowed;
        }
        .timer-text {
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 500;
            user-select: none;
        }
        .continue-btn {
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-radius: 10px;
            background-color: #334155;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            cursor: not-allowed;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .continue-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .continue-btn.active:hover {
            background-color: #1d4ed8;
        }
        .success-message {
            margin-top: 14px;
            color: #4ade80;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <div class="verify-container">
        <h3>Security Verification</h3>
        <p class="info-text">Please complete verification to proceed to your destination.</p>
        
        <div class="checkbox-wrapper disabled" id="checkboxWrapper">
            <input type="checkbox" id="verifyCheckbox" disabled>
            <span class="timer-text" id="timerText"><i class="fa-solid fa-clock"></i> Please wait <span id="countdown">5</span>s...</span>
        </div>

        <button class="continue-btn" id="continueBtn" disabled>Continue</button>
        
        <div class="success-message" id="successMessage"><i class="fa-solid fa-circle-check"></i> Verified Successfully! Redirecting...</div>
    </div>

    <script>
        // Extract URL parameters passed from PopAds (e.g. ?imp=IMPRESSION_ID)
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param) || '';
        }

        const impressionId = getQueryParam('imp'); 
        const accountId = "ad0d7de48373f60fb123235760ef98f0"; // Your PopAds Account ID
        const conversionValue = "0.01"; // Estimated conversion value in USD
        
        // Define your direct link target here
        const directTargetUrl = "https://omg10.com/4/11736041"; 

        const checkboxWrapper = document.getElementById('checkboxWrapper');
        const verifyCheckbox = document.getElementById('verifyCheckbox');
        const timerText = document.getElementById('timerText');
        const countdownSpan = document.getElementById('countdown');
        const continueBtn = document.getElementById('continueBtn');
        const successMessage = document.getElementById('successMessage');

        let timeLeft = 5; // Timer set to 5 seconds
        let isVerified = false;

        const timer = setInterval(() => {
            timeLeft--;
            countdownSpan.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                checkboxWrapper.classList.remove('disabled');
                checkboxWrapper.style.backgroundColor = '#334155';
                verifyCheckbox.disabled = false;
                timerText.innerHTML = '<i class="fa-solid fa-shield-halved" style="color: #60a5fa;"></i> I\'m not a robot';
            }
        }, 1000);

        verifyCheckbox.addEventListener('change', function() {
            if (this.checked) {
                checkboxWrapper.style.backgroundColor = '#064e3b';
                checkboxWrapper.style.borderColor = '#059669';
                isVerified = true;
                continueBtn.disabled = false;
                continueBtn.classList.add('active');
            } else {
                checkboxWrapper.style.backgroundColor = '#334155';
                checkboxWrapper.style.borderColor = '#475569';
                isVerified = false;
                continueBtn.disabled = true;
                continueBtn.classList.remove('active');
            }
        });

        continueBtn.addEventListener('click', function() {
            if (isVerified) {
                successMessage.style.display = 'block';
                continueBtn.textContent = 'Redirecting...';
                continueBtn.disabled = true;
                verifyCheckbox.disabled = true;

                // Fire PopAds conversion postback pixel asynchronously if impression ID exists
                if (impressionId) {
                    const postbackUrl = `//serve.popads.net/cpixel.php?s2s=0&aid=${accountId}&id=${impressionId}&value=${conversionValue}`;
                    const pxl = new Image();
                    pxl.src = postbackUrl;
                }
                
                // Redirect user to the direct link destination after a short UI pause
                setTimeout(() => {
                    window.location.href = directTargetUrl; 
                }, 800);
            }
        });
    </script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAjqIzlrb9aq8qtEtYFA9GbDZeiydVvbz4",
          authDomain: "git9-43302.firebaseapp.com",
          databaseURL: "https://git9-43302-default-rtdb.firebaseio.com",
          projectId: "git9-43302",
          storageBucket: "git9-43302.firebasestorage.app",
          messagingSenderId: "724237457030",
          appId: "1:724237457030:web:a65c2756f1aa13503aa307",
          measurementId: "G-W8Q9T9KRP1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const statsRef = doc(db, "analytics", "page_stats");
        let startTime = Date.now();
        let hasCountedVisit = false;

        async function trackVisit() {
            try {
                const docSnap = await getDoc(statsRef);
                if (!docSnap.exists()) {
                    await setDoc(statsRef, { totalVisitors: 1, totalDuration: 0, totalSessions: 0 });
                } else {
                    await updateDoc(statsRef, {
                        totalVisitors: increment(1)
                    });
                }
                hasCountedVisit = true;
            } catch (error) {
                console.error("Error tracking visit:", error);
            }
        }

        trackVisit();

        async function trackStayTime() {
            if (!hasCountedVisit) return;
            let durationSec = (Date.now() - startTime) / 1000;
            
            try {
                const docSnap = await getDoc(statsRef);
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    let newTotalDuration = (data.totalDuration || 0) + durationSec;
                    let newTotalSessions = (data.totalSessions || 0) + 1;

                    await updateDoc(statsRef, {
                        totalDuration: newTotalDuration,
                        totalSessions: newTotalSessions
                    });
                }
            } catch (error) {
                console.error("Error updating duration:", error);
            }
        }

        window.addEventListener('beforeunload', trackStayTime);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                trackStayTime();
            }
        });
    </script>
</body>
</html>
