<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Transfer Cloud - Verification</title>
    <!-- ADD YOUR MONETAG SMART TAG CODE HERE TO LOAD IN-PAGE PUSH / VIGNETTES -->
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --blue: #38bdf8; --text: #f8fafc; --muted: #94a3b8; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .box { width: 100%; max-width: 420px; padding: 20px; box-sizing: border-box; }
        .card { background: var(--card); border: 1px solid #334155; border-radius: 16px; padding: 30px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .icon { font-size: 44px; margin-bottom: 12px; }
        .title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
        .meta { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
        .status { font-size: 14px; color: var(--blue); background: rgba(56,189,248,0.1); padding: 10px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; }
        .track { background: #334155; height: 6px; border-radius: 99px; margin-bottom: 24px; overflow: hidden; }
        .fill { background: var(--blue); height: 100%; width: 0%; transition: width 0.1s linear; }
        .btn { display: block; width: 100%; padding: 16px; background: #475569; color: #94a3b8; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; text-decoration: none; cursor: not-allowed; transition: all 0.2s; }
        .btn.ready { background: var(--blue); color: var(--bg); cursor: pointer; box-shadow: 0 0 15px rgba(56,189,248,0.3); }
    </style>
</head>
<body>
    <div class="box">
        <div class="card">
            <div class="icon">📥</div>
            <div class="title">Requested_File_Package.zip</div>
            <div class="meta">Size: 14.8 MB | Safety Scan: Verified</div>
            <div class="status" id="status">Connecting to secure storage cluster...</div>
            <div class="track"><div class="fill" id="fill"></div></div>
            <a href="#" class="btn" id="btn" onclick="nextPage(event)">Checking Slots (<span id="sec">5</span>s)</a>
        </div>
    </div>
    <script>
        const link = "YOUR_MONETAG_DIRECT_LINK_HERE";
        let time = 5;
        const interval = setInterval(() => {
            time--;
            document.getElementById('sec').innerText = time;
            document.getElementById('fill').style.width = ((5 - time) / 5 * 100) + '%';
            if (time <= 0) {
                clearInterval(interval);
                document.getElementById('status').innerText = "Transfer Slot Ready!";
                const btn = document.getElementById('btn');
                btn.innerText = "Proceed to Server Selection";
                btn.classList.add('ready');
            }
        }, 1000);
        function nextPage(e) {
            e.preventDefault();
            if (time <= 0) {
                window.open(link, '_blank');
                window.location.href = "step2.html";
            }
        }
    </script>
</body>
</html>
