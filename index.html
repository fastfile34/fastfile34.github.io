    <title>Security Verification</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .verify-container {
            background: #1e293b;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            text-align: center;
            width: 100%;
            max-width: 380px;
        }
        h3 {
            margin-bottom: 8px;
            color: #f8fafc;
            font-size: 20px;
            font-weight: 700;
        }
        .info-text {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .checkbox-wrapper {
            position: relative;
            background-color: #334155;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid #475569;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }
        .checkbox-wrapper.disabled {
            cursor: not-allowed;
            opacity: 0.85;
            background-color: #1e293b;
        }
        .checkbox-wrapper input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #2563eb;
        }
        .checkbox-wrapper.disabled input[type="checkbox"] {
            cursor: not-allowed;
        }
        .timer-text {
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 500;
            user-select: none;
        }
        .continue-btn {
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-radius: 10px;
            background-color: #334155;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            cursor: not-allowed;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .continue-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .continue-btn.active:hover {
            background-color: #1d4ed8;
        }
        .success-message {
            margin-top: 14px;
            color: #4ade80;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <div class="verify-container">
        <h3>Security Verification</h3>
        <p class="info-text">You will be redirected to the download links page after security verification.</p>
        
        <div class="checkbox-wrapper disabled" id="checkboxWrapper">
            <input type="checkbox" id="verifyCheckbox" disabled>
            <span class="timer-text" id="timerText"><i class="fa-solid fa-clock"></i> Please wait <span id="countdown">15</span>s...</span>
        </div>

        <button class="continue-btn" id="continueBtn" disabled>Continue</button>
        
        <div class="success-message" id="successMessage"><i class="fa-solid fa-circle-check"></i> Verified Successfully! Redirecting...</div>
    </div>

    <script>
        // Push a dummy state to the history stack so the back action can be intercepted
        history.pushState(null, null, window.location.href);

        window.addEventListener('popstate', function(event) {
            window.location.href = 'download-links.html';
        });

        const checkboxWrapper = document.getElementById('checkboxWrapper');
        const verifyCheckbox = document.getElementById('verifyCheckbox');
        const timerText = document.getElementById('timerText');
        const countdownSpan = document.getElementById('countdown');
        const continueBtn = document.getElementById('continueBtn');
        const successMessage = document.getElementById('successMessage');

        let timeLeft = 15;
        let isVerified = false;

        const timer = setInterval(() => {
            timeLeft--;
            countdownSpan.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                checkboxWrapper.classList.remove('disabled');
                checkboxWrapper.style.backgroundColor = '#334155';
                verifyCheckbox.disabled = false;
                timerText.innerHTML = '<i class="fa-solid fa-shield-halved" style="color: #60a5fa;"></i> I\'m not a robot';
            }
        }, 1000);

        verifyCheckbox.addEventListener('change', function() {
            if (this.checked) {
                checkboxWrapper.style.backgroundColor = '#064e3b';
                checkboxWrapper.style.borderColor = '#059669';
                isVerified = true;
                continueBtn.disabled = false;
                continueBtn.classList.add('active');
            } else {
                checkboxWrapper.style.backgroundColor = '#334155';
                checkboxWrapper.style.borderColor = '#475569';
                isVerified = false;
                continueBtn.disabled = true;
                continueBtn.classList.remove('active');
            }
        });

        continueBtn.addEventListener('click', function() {
            if (isVerified) {
                successMessage.style.display = 'block';
                continueBtn.textContent = 'Redirecting...';
                continueBtn.disabled = true;
                verifyCheckbox.disabled = true;
                
                setTimeout(() => {
                    window.location.href = 'download-links.html'; 
                }, 1000);
            }
        });
    </script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // TODO: Replace with your actual Firebase configuration
    const firebaseConfig = {

  authDomain: "mockia-13086.firebaseapp.com",
  projectId: "mockia-13086",
  storageBucket: "mockia-13086.firebasestorage.app",
  messagingSenderId: "229542181744",
  appId: "1:229542181744:web:59f478f006025dabba2db5"
};
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const statsRef = doc(db, "analytics", "page_stats");
    let startTime = Date.now();
    let hasCountedVisit = false;

    async function trackVisit() {
        try {
            const docSnap = await getDoc(statsRef);
            if (!docSnap.exists()) {
                // Initialize document if it doesn't exist
                await setDoc(statsRef, { totalVisitors: 1, totalDuration: 0, totalSessions: 0 });
            } else {
                // Increment visitor count
                await updateDoc(statsRef, {
                    totalVisitors: increment(1)
                });
            }
            hasCountedVisit = true;
        } catch (error) {
            console.error("Error tracking visit:", error);
        }
    }

    trackVisit();

    // Track stay time when user leaves or closes the page
    async function trackStayTime() {
        if (!hasCountedVisit) return;
        let durationSec = (Date.now() - startTime) / 1000;
        
        try {
            const docSnap = await getDoc(statsRef);
            if (docSnap.exists()) {
                let data = docSnap.data();
                let newTotalDuration = (data.totalDuration || 0) + durationSec;
                let newTotalSessions = (data.totalSessions || 0) + 1;

                await updateDoc(statsRef, {
                    totalDuration: newTotalDuration,
                    totalSessions: newTotalSessions
                });
            }
        } catch (error) {
            console.error("Error updating duration:", error);
        }
    }

    // Use visibilitychange and beforeunload to capture stay duration accurately
    window.addEventListener('beforeunload', trackStayTime);
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
            trackStayTime();
        }
    });
</script>
