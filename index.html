<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://quge5.com/88/tag.min.js" data-zone="276958" async data-cfasync="false"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .verify-container {
            background: #1e293b;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            text-align: center;
            width: 100%;
            max-width: 380px;
        }
        h3 {
            margin-bottom: 8px;
            color: #f8fafc;
            font-size: 20px;
            font-weight: 700;
        }
        .info-text {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .checkbox-wrapper {
            position: relative;
            background-color: #334155;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid #475569;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }
        .checkbox-wrapper.disabled {
            cursor: not-allowed;
            opacity: 0.85;
            background-color: #1e293b;
        }
        .checkbox-wrapper input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #2563eb;
        }
        .checkbox-wrapper.disabled input[type="checkbox"] {
            cursor: not-allowed;
        }
        .timer-text {
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 500;
            user-select: none;
        }
        .continue-btn {
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-radius: 10px;
            background-color: #334155;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            cursor: not-allowed;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .continue-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .continue-btn.active:hover {
            background-color: #1d4ed8;
        }
        .success-message {
            margin-top: 14px;
            color: #4ade80;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <div class="verify-container">
        <h3>Security Verification</h3>
        <p class="info-text">You will be redirected to the download links page after security verification.</p>
        
        <div class="checkbox-wrapper disabled" id="checkboxWrapper">
            <input type="checkbox" id="verifyCheckbox" disabled>
            <span class="timer-text" id="timerText"><i class="fa-solid fa-clock"></i> Please wait <span id="countdown">10</span>s...</span>
        </div>

        <button class="continue-btn" id="continueBtn" disabled>Continue</button>
        
        <div class="success-message" id="successMessage"><i class="fa-solid fa-circle-check"></i> Verified Successfully! Redirecting...</div>
    </div>

    <script>
        const checkboxWrapper = document.getElementById('checkboxWrapper');
        const verifyCheckbox = document.getElementById('verifyCheckbox');
        const timerText = document.getElementById('timerText');
        const countdownSpan = document.getElementById('countdown');
        const continueBtn = document.getElementById('continueBtn');
        const successMessage = document.getElementById('successMessage');

        let timeLeft = 10;
        let isVerified = false;

        const timer = setInterval(() => {
            timeLeft--;
            countdownSpan.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                checkboxWrapper.classList.remove('disabled');
                checkboxWrapper.style.backgroundColor = '#334155';
                verifyCheckbox.disabled = false;
                timerText.innerHTML = '<i class="fa-solid fa-shield-halved" style="color: #60a5fa;"></i> I\'m not a robot';
            }
        }, 1000);

        verifyCheckbox.addEventListener('change', function() {
            if (this.checked) {
                checkboxWrapper.style.backgroundColor = '#064e3b';
                checkboxWrapper.style.borderColor = '#059669';
                isVerified = true;
                continueBtn.disabled = false;
                continueBtn.classList.add('active');
            } else {
                checkboxWrapper.style.backgroundColor = '#334155';
                checkboxWrapper.style.borderColor = '#475569';
                isVerified = false;
                continueBtn.disabled = true;
                continueBtn.classList.remove('active');
            }
        });

        continueBtn.addEventListener('click', function() {
            if (isVerified) {
                successMessage.style.display = 'block';
                continueBtn.textContent = 'Redirecting...';
                continueBtn.disabled = true;
                verifyCheckbox.disabled = true;
                
                setTimeout(() => {
                    window.location.href = 'download-links.html'; 
                }, 1000);
            }
        });
    </script>

</body>
</html>
